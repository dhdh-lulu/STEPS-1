name: 刷步数

on:
  schedule:
    - cron: '7 4 * * *'   # UTC 04:07 北京时间12:07
  #  - cron: '23 6 * * *'  # UTC 06:23 北京时间14:23
    - cron: '45 8 * * *'  # UTC 08:45 北京时间16:45
  #  - cron: '18 10 * * *' # UTC 10:18 北京时间18:18
    - cron: '39 12 * * *' # UTC 12:39 北京时间20:39
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
